<!DOCTYPE html>
<html>
    <head>
        <title>Đăng nhập</title>
        <meta charset="UTF-8">

        <style>
            body {
                font-family: Arial;
                background: #f2f2f2;
            }

            .login-box {
                width: 300px;
                margin: 100px auto;
                padding: 25px;
                background: white;
                border-radius: 10px;
            }

            input {
                width: 100%;
                padding: 8px;
                margin: 8px 0;
                box-sizing: border-box;
            }

            button {
                width: 100%;
                padding: 10px;
                background: #333;
                color: white;
                border: none;
                cursor: pointer;
            }
        </style>
    </head>

    <body>

        <div class="login-box">

            <h2>Đăng nhập</h2>

            <form action="LoginServlet" method="post">

                <label>Username:</label>
                <input type="text" name="username" required>

                <label>Password:</label>
                <input type="password" name="password" required>

                <button type="submit">Đăng nhập</button>

            </form>

        </div>

    </body>
</html>
